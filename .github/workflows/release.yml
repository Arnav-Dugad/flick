name: Release

# Pushing a tag like v1.2.3 builds a signed release APK and publishes a GitHub Release with:
#   flick-1.2.3.apk, flick-1.2.3.apk.sha256 and version.json (read by Flick's in-app updater).
# Setup (once): docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # SHA-256 of Flick's signing certificate. A release signed with any other key is refused,
  # because users' phones would reject it as an update.
  EXPECTED_CERT_SHA256: d06622af2e42b307edbb6b7691002e4c456b4ad4182778e80d995e312dcf422e

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          if ! [[ "$VER" =~ ^([0-9]{1,3})\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Tag must look like v1.2.3 (minor and patch below 100), got $TAG"
            exit 1
          fi
          CODE=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing $VER (versionCode $CODE)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK packages
        run: |
          # The runner image ships the Android SDK; install exactly what Flick builds against.
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FLICK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret FLICK_KEYSTORE_BASE64 is missing. See docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flick-release.jks"

      - name: Test and build signed APK
        env:
          FLICK_KEYSTORE_PATH: ${{ runner.temp }}/flick-release.jks
          FLICK_KEYSTORE_PASSWORD: ${{ secrets.FLICK_KEYSTORE_PASSWORD }}
          FLICK_KEY_ALIAS: ${{ secrets.FLICK_KEY_ALIAS }}
          FLICK_KEY_PASSWORD: ${{ secrets.FLICK_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon --stacktrace
          :core:test :app:testReleaseUnitTest :app:assembleRelease
          -Pflick.versionName=${{ steps.version.outputs.name }}
          -Pflick.versionCode=${{ steps.version.outputs.code }}

      - name: Verify signature and package assets
        id: assets
        run: |
          VER="${{ steps.version.outputs.name }}"
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee signer.txt
          ACTUAL=$(grep -m1 "certificate SHA-256 digest" signer.txt | awk '{print $NF}')
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with $ACTUAL, expected $EXPECTED_CERT_SHA256"
            exit 1
          fi
          mkdir -p dist
          OUT="flick-$VER.apk"
          cp "$APK" "dist/$OUT"
          (cd dist && sha256sum "$OUT" > "$OUT.sha256")
          SHA=$(cut -d' ' -f1 "dist/$OUT.sha256")
          printf '{"versionCode":%d,"versionName":"%s","apk":"%s","sha256":"%s","minSdk":26}\n' \
            "${{ steps.version.outputs.code }}" "$VER" "$OUT" "$SHA" > dist/version.json
          cat dist/version.json
          ls -la dist

      - name: Release notes from CHANGELOG.md
        run: |
          VER="${{ steps.version.outputs.name }}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Bug fixes and improvements." > notes.md; fi
          {
            echo ""
            echo "---"
            echo "**Install:** download \`flick-$VER.apk\` below and open it. On Android 13+ you may need to allow restricted settings first; see the [README](https://github.com/${{ github.repository }}#install)."
            echo ""
            echo "**Verify:** SHA-256 \`$(cut -d' ' -f1 dist/flick-$VER.apk.sha256)\` · signing certificate SHA-256 \`$EXPECTED_CERT_SHA256\`"
          } >> notes.md
          cat notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "Flick ${{ steps.version.outputs.name }}"
          --notes-file notes.md
          --verify-tag

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/flick-release.jks"
